let currentLang = 'he';

function setLang(lang) {
  currentLang = lang;
  const L = LANG[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir  = L.dir;

  document.getElementById('t-title').textContent    = L.title;
  document.getElementById('t-sub').textContent      = L.sub;
  document.getElementById('t-label').textContent    = L.label;
  document.getElementById('t-btn').textContent      = L.btn;
  document.getElementById('t-buy').innerHTML        = L.buy;
  document.getElementById('t-welcome').textContent  = L.welcome;
  document.getElementById('t-welcome-sub').textContent = L.welcomeSub;
  document.getElementById('t-enter').textContent    = L.enter;

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.getElementById('gate-msg').className = 'gate-msg';
}

/* ============================================================
   LICENSE VALIDATION
   ============================================================ */
const SECRET = 'KOORS2024EDU_AINATOMER';
const EPOCH  = new Date('2024-01-01').getTime();

function todayDay() {
  return Math.floor((Date.now() - EPOCH) / 86400000);
}

function base36(n, pad) {
  return n.toString(36).toUpperCase().padStart(pad, '0');
}

function simpleHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h) ^ str.charCodeAt(i);
    h = h >>> 0;
  }
  return h;
}

function validateCode(raw) {
  const code = raw.replace(/-/g, '').toUpperCase();
  if (code.length !== 19) return { ok: false };  // KOORS(5) + CUST(5) + EXP(5) + CHK(4)
  if (!code.startsWith('KOORS')) return { ok: false };

  const custPart = code.slice(5, 10);
  const expPart  = code.slice(10, 15);
  const chkPart  = code.slice(15, 19);

  const expectedChk = base36(simpleHash(custPart + expPart + SECRET) % (36 ** 4), 4);
  if (chkPart !== expectedChk) return { ok: false };

  const expiryDay = parseInt(expPart, 36);
  if (todayDay() > expiryDay) return { ok: false, expired: true };

  const expiryDate = new Date(EPOCH + expiryDay * 86400000);
  const custId = parseInt(custPart, 36);

  return { ok: true, custId, expiryDate };
}

/* ============================================================
   ACTIONS
   ============================================================ */
function formatCode(input) {
  let v = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 19);
  // Insert dashes: KOORS-XXXXX-XXXXX-XXXX
  if (v.length > 15) v = v.slice(0,5) + '-' + v.slice(5,10) + '-' + v.slice(10,15) + '-' + v.slice(15);
  else if (v.length > 10) v = v.slice(0,5) + '-' + v.slice(5,10) + '-' + v.slice(10);
  else if (v.length > 5)  v = v.slice(0,5) + '-' + v.slice(5);
  input.value = v;
  document.getElementById('gate-msg').className = 'gate-msg';
  input.classList.remove('error', 'success');
}

function showMsg(text, type) {
  const el = document.getElementById('gate-msg');
  el.textContent = text;
  el.className   = 'gate-msg ' + type;
}

function setLoading(on) {
  document.getElementById('gate-btn').disabled    = on;
  document.getElementById('btn-spinner').style.display = on ? 'block' : 'none';
}

function submitCode() {
  const raw = document.getElementById('code-input').value.trim();
  if (!raw) return;

  setLoading(true);

  // Simulate brief check
  setTimeout(() => {
    const result = validateCode(raw);
    setLoading(false);

    const L = LANG[currentLang];

    if (result.expired) {
      document.getElementById('code-input').classList.add('error');
      showMsg(L.errExpired, 'error');
      return;
    }
    if (!result.ok) {
      document.getElementById('code-input').classList.add('error');
      showMsg(L.errInvalid, 'error');
      return;
    }

    // Valid — save license token
    const token = btoa(JSON.stringify({
      code:        raw.replace(/-/g,'').toUpperCase(),
      custId:      result.custId,
      expiry:      result.expiryDate.getTime(),
      activatedAt: Date.now(),
      lang:        currentLang,
    }));
    localStorage.setItem('koors_license', token);

    document.getElementById('code-input').classList.add('success');

    // Show success screen
    document.getElementById('gate-form').classList.add('hide');
    const ss = document.getElementById('success-screen');
    ss.classList.add('show');

    const fmt = result.expiryDate.toLocaleDateString(
      currentLang === 'he' ? 'he-IL' : currentLang === 'ar' ? 'ar-SA' : 'en-GB'
    );
    document.getElementById('t-expiry').textContent = L.expiresOn + fmt;

    // Auto redirect after 2.5s
    setTimeout(goToApp, 2500);
  }, 600);
}

function goToApp() {
  const params   = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect');
  window.location.href = redirect || '../teacher-engine/interactive-teacher.html';
}

/* ============================================================
   GOOGLE SIGN-IN (GIS)
   ============================================================ */
// Google OAuth Client ID — teachers can replace with their school's Client ID
const GOOGLE_CLIENT_ID = localStorage.getItem('koors_gci') || '';

function initGoogleSignIn() {
  if (!window.google?.accounts?.id || !GOOGLE_CLIENT_ID) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback:  handleGoogleToken,
    auto_select: false,
  });
}

function triggerGoogleSignIn() {
  if (!GOOGLE_CLIENT_ID) {
    // Fallback: create a time-limited demo license for Google users
    if (!window.google?.accounts?.id) {
      showMsg('⚠️ ספריית Google Identity Services לא נטענה. נסה רענון.', 'error');
      return;
    }
    // Use a minimal public demo flow — creates anonymous license for 90 days
    createGoogleDemoLicense();
    return;
  }
  if (!window.google?.accounts?.id) {
    showMsg('⚠️ Google Identity Services לא נטען', 'error');
    return;
  }
  google.accounts.id.prompt(note => {
    if (note.isNotDisplayed() || note.isSkippedMoment()) {
      google.accounts.id.renderButton(
        document.getElementById('google-signin-btn').parentNode,
        { theme: 'filled_blue', size: 'large', locale: 'iw', width: 340 }
      );
    }
  });
}

function handleGoogleToken(response) {
  try {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    completeGoogleLogin({
      name:    payload.name  || payload.email,
      email:   payload.email || '',
      picture: payload.picture || '',
      sub:     payload.sub || '',
    });
  } catch(e) {
    showMsg('❌ שגיאה בכניסה עם Google: ' + e.message, 'error');
  }
}

function completeGoogleLogin(user) {
  // Store Google user profile for the main app
  localStorage.setItem('koors_google_auth', JSON.stringify(user));

  // Create a 1-year license token based on Google identity
  const oneYear = Date.now() + 365 * 24 * 60 * 60 * 1000;
  const token = btoa(JSON.stringify({
    googleAuth:  true,
    email:       user.email,
    name:        user.name,
    custId:      simpleHash(user.sub || user.email) % 99999,
    expiry:      oneYear,
    activatedAt: Date.now(),
    lang:        currentLang,
  }));
  localStorage.setItem('koors_license', token);

  // Show success
  document.getElementById('gate-form').classList.add('hide');
  const ss = document.getElementById('success-screen');
  ss.classList.add('show');
  document.getElementById('success-screen').querySelector('.success-icon').textContent = '🔐';
  document.getElementById('t-welcome').textContent     = 'ברוך הבא, ' + (user.name.split(' ')[0] || '');
  document.getElementById('t-welcome-sub').textContent = 'כניסה עם ' + user.email;
  document.getElementById('t-expiry').textContent      = '';

  setTimeout(goToApp, 2000);
}

function createGoogleDemoLicense() {
  // No Client ID configured — create anonymous demo license valid 90 days
  // This lets teachers try the system immediately
  const ninetyDays = Date.now() + 90 * 24 * 60 * 60 * 1000;
  const token = btoa(JSON.stringify({
    googleAuth:  true,
    email:       'demo@google',
    name:        'מורה Demo',
    custId:      99999,
    expiry:      ninetyDays,
    activatedAt: Date.now(),
    lang:        currentLang,
  }));
  localStorage.setItem('koors_license', token);
  document.getElementById('gate-form').classList.add('hide');
  const ss = document.getElementById('success-screen');
  ss.classList.add('show');
  document.getElementById('success-screen').querySelector('.success-icon').textContent = '🚀';
  document.getElementById('t-welcome').textContent     = 'כניסה Demo';
  document.getElementById('t-welcome-sub').textContent = 'גישה לתקופת ניסיון (90 יום)';
  setTimeout(goToApp, 2000);
}

// Wire up GIS once loaded
window.addEventListener('load', () => { setTimeout(initGoogleSignIn, 500); });

/* ============================================================
   INIT — check if already licensed
   ============================================================ */
(function checkExistingLicense() {
  try {
    const raw = localStorage.getItem('koors_license');
    if (!raw) return;
    const data = JSON.parse(atob(raw));
    if (data.expiry > Date.now()) {
      // Already have valid license, skip gate
      goToApp();
    } else {
      localStorage.removeItem('koors_license');
    }
  } catch {
    localStorage.removeItem('koors_license');
  }
})();
</script>
