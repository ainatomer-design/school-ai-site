<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אתר בית הספר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary:#1a73e8; --secondary:#fbbc04; --accent:#34a853; --bg:#f0f4f8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Heebo, sans-serif; background: var(--bg); color: #202124; min-height: 100vh; }
    .banner {
      background: linear-gradient(145deg, var(--primary) 0%, #0d2148 100%);
      color: #fff; text-align: center; padding: 48px 24px 40px; position: relative;
    }
    .banner::before, .banner::after {
      content: ''; position: absolute; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, transparent, var(--secondary), transparent);
    }
    .banner::before { top: 0; } .banner::after { bottom: 0; }
    .banner h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
    .banner p { opacity: .85; font-size: 1.05rem; }
    .year { display: inline-block; margin-top: 12px; background: rgba(255,255,255,.15); padding: 4px 14px; border-radius: 999px; font-size: .8rem; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    .ann {
      display: none; background: #fff; border-right: 5px solid var(--primary);
      border-radius: 12px; padding: 16px 18px; margin-bottom: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
    }
    .ann.show { display: block; }
    .ann strong { color: var(--primary); }
    h2 { font-size: 1.05rem; margin: 8px 0 14px; display: flex; align-items: center; gap: 8px; }
    h2 span.line { flex: 1; height: 2px; background: linear-gradient(90deg, var(--primary), transparent); opacity: .3; }
    .links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
    .link {
      background: #fff; border-radius: 14px; padding: 18px 10px; text-align: center;
      text-decoration: none; color: inherit; box-shadow: 0 2px 10px rgba(0,0,0,.06);
      border-top: 4px solid var(--primary); transition: transform .15s;
    }
    .link:hover { transform: translateY(-3px); }
    .link .ico { font-size: 1.6rem; display: block; margin-bottom: 6px; }
    .link .txt { font-weight: 700; font-size: .85rem; }
    .classes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cls { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .cls h3 { font-size: 1rem; margin-bottom: 4px; }
    .cls .meta { color: #5f6368; font-size: .82rem; }
    .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: #e8f0fe; color: var(--primary); font-size: .72rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    footer { text-align: center; color: #9aa0a6; font-size: .75rem; margin-top: 36px; }
    footer a { color: var(--primary); }
    .err { background: #fce8e6; color: #c5221f; padding: 14px; border-radius: 10px; }
    @media (max-width: 640px) {
      .links, .classes { grid-template-columns: 1fr 1fr; }
      .banner h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <header class="banner">
    <h1 id="school-name">טוען...</h1>
    <p id="school-motto"></p>
    <div class="year" id="school-year"></div>
  </header>
  <main class="wrap">
    <div class="ann" id="ann"></div>
    <h2>⚡ קישורים מהירים <span class="line"></span></h2>
    <div class="links" id="links"></div>
    <h2>🏫 כיתות <span class="line"></span></h2>
    <div class="classes" id="classes"></div>
    <footer>
      אתר הדגמה — התוכן נשמר ב-Supabase ·
      <a href="/admin">לוח ניהול + עוזר AI</a>
    </footer>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    function applyColors(c) {
      const r = document.documentElement.style;
      r.setProperty('--primary', c.primary || '#1a73e8');
      r.setProperty('--secondary', c.secondary || '#fbbc04');
      r.setProperty('--accent', c.accent || '#34a853');
      r.setProperty('--bg', c.bg || '#f0f4f8');
    }
    function render(state) {
      const s = state.school || {};
      document.title = s.name || 'אתר בית הספר';
      $('school-name').textContent = s.name || 'בית הספר';
      $('school-motto').textContent = s.motto || '';
      $('school-year').textContent = s.year || '';
      applyColors(state.colors || {});
      const ann = state.announcement || {};
      const annEl = $('ann');
      if (ann.active && ann.text) {
        annEl.classList.add('show');
        annEl.innerHTML = '<strong>📢 הודעה: </strong>' + ann.text;
      }
      $('links').innerHTML = (state.links || []).map(l => `
        <a class="link" href="${l.url || '#'}" style="border-top-color:${l.color || 'var(--primary)'}">
          <span class="ico">${l.icon || '🔗'}</span>
          <span class="txt">${l.text || ''}</span>
        </a>`).join('');
      $('classes').innerHTML = (state.classes || []).filter(c => !c.archived).map(c => `
        <div class="cls">
          <h3>${c.name || ''}</h3>
          <div class="meta">${c.teacher || ''} ${c.room ? '· חדר ' + c.room : ''}</div>
          <div class="tags">${(c.subjects || []).map(x => '<span class="tag">' + (x.name || x) + '</span>').join('')}</div>
        </div>`).join('') || '<p style="color:#9aa0a6">אין כיתות עדיין.</p>';
    }
    fetch('/api/state').then(r => r.json()).then(data => {
      if (data.state) render(data.state);
      else throw new Error(data.error?.message || 'שגיאה');
    }).catch(err => {
      $('school-name').textContent = 'חסרה הגדרה';
      document.querySelector('main').insertAdjacentHTML('afterbegin',
        '<div class="err">לא ניתן לטעון מ-Supabase. פתחו /admin והשלימו מפתחות. ' + err.message + '</div>');
    });
  </script>
</body>
</html>
